version: "3.8"

services:
  # ==========================================================================
  # AI DIAL Frontend & Core
  # ==========================================================================

  themes:
    image: docker.io/epam/ai-dial-chat-themes:0.9.1
    ports:
      - "3001:8080"

  chat:
    ports:
      - "3000:3000"
    image: docker.io/epam/ai-dial-chat:0.26.0
    depends_on:
      - themes
      - core
    environment:
      NEXTAUTH_SECRET: "secret"
      THEMES_CONFIG_HOST: "http://themes:8080"
      DIAL_API_HOST: "http://core:8080"
      DIAL_API_KEY: "dial_api_key"
      ENABLED_FEATURES: "conversations-section,prompts-section,top-settings,top-clear-conversation,top-chat-info,top-chat-model-settings,empty-chat-settings,header,footer,request-api-key,report-an-issue,likes,conversations-sharing,input-files,attachments-manager,prompts-sharing,prompts-publishing,conversations-publishing,custom-logo,input-links,custom-applications,message-templates,marketplace,quick-apps,code-apps,applications-sharing,marketplace-table-view"
      KEEP_ALIVE_TIMEOUT: 20000

  core:
    user: root
    ports:
      - "8080:8080"
    image: docker.io/epam/ai-dial-core:0.25.1
    environment:
      'AIDIAL_SETTINGS': '/opt/settings/settings.json'
      'JAVA_OPTS': '-Dgflog.config=/opt/settings/gflog.xml'
      'LOG_DIR': '/app/log'
      'aidial.config.files': '["/opt/config/config.json"]'
      # Cloudflare R2 Storage (S3-compatible)
      'aidial.storage.overrides': '{ "jclouds.provider": "s3", "jclouds.endpoint": "${R2_ENDPOINT_URL}", "jclouds.identity": "${R2_ACCESS_KEY_ID}", "jclouds.credential": "${R2_SECRET_ACCESS_KEY}", "jclouds.regions": "auto", "jclouds.s3.virtual-host-buckets": "false", "jclouds.filesystem.basedir": "${R2_BUCKET_NAME}" }'
      'aidial.redis.singleServerConfig.address': 'redis://dragonfly:6379'
      # OpenRouter API key passed through to config.json variable interpolation
      'OPENROUTER_API_KEY': '${OPENROUTER_API_KEY}'
      'OPENROUTER_ENDPOINT': 'https://openrouter.ai/api/v1/chat/completions'
    depends_on:
      - dragonfly
      - ts-mcp-server
      - py-mcp-server
      - js-mcp-server
    volumes:
      - ./infrastructure/settings:/opt/settings
      - ./infrastructure/core:/opt/config
      - ./core-logs/:/app/log

  # ==========================================================================
  # Authentication (Keycloak & Auth Helper)
  # ==========================================================================
  
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: dial
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dial_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_ADMIN_URL: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    depends_on:
      - postgres
    volumes:
      - ./infrastructure/init/keycloak:/opt/keycloak/data/import

  auth-helper:
    image: docker.io/epam/ai-dial-auth-helper:0.6.2
    restart: always
    ports:
      - "8089:8080"
    environment:
      # Keycloak is on port 8080 inside the Docker network, 8180 on the host
      - DIAL_JWKS_URL=http://keycloak:8080/realms/dial/protocol/openid-connect/certs
      - DIAL_CLIENT_ID=dial-front
      - DIAL_ISSUER_URL=http://localhost:8180/realms/dial
    depends_on:
      - keycloak

  # ==========================================================================
  # Cache
  # ==========================================================================

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    restart: always
    ports:
      - "6379:6379"

  # ==========================================================================
  # Databases
  # ==========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dial_password}
      POSTGRES_DB: evidence
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/init/postgres:/docker-entrypoint-initdb.d

  directus:
    image: directus/directus:latest
    profiles:
      - data
    ports:
      - "8055:8055"
    depends_on:
      - postgres
    environment:
      KEY: ${DIRECTUS_KEY:-supersecretkey}
      SECRET: ${DIRECTUS_SECRET:-supersecretdirsecret}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@evidence.local}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin_password}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: evidence
      DB_USER: dial
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dial_password}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      - directus_uploads:/directus/uploads
      - ./infrastructure/directus/extensions:/directus/extensions

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # ==========================================================================
  # SBV — SMS Backup Viewer (sidecar for XML import + web browsing)
  # ==========================================================================

  sbv:
    image: ghcr.io/lowcarbdev/sbv:stable
    restart: unless-stopped
    ports:
      - "8084:8081"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - sbv_data:/data

  # ==========================================================================
  # MCP Servers
  # ==========================================================================

  ts-mcp-server:
    build: ./mcp-servers/ts-mcp-server
    restart: always
    expose:
      - "8081"
    environment:
      - PORT=8081
      - DATABASE_URL=postgresql://dial:${POSTGRES_PASSWORD:-dial_password}@postgres:5432/evidence
      - SBV_URL=http://sbv:8081
      - SBV_USERNAME=${SBV_USERNAME:-}
      - SBV_PASSWORD=${SBV_PASSWORD:-}
    depends_on:
      - sbv

  py-mcp-server:
    build: ./mcp-servers/py-mcp-server
    restart: always
    expose:
      - "8000"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - LANCEDB_PATH=/data/lancedb
    volumes:
      - lancedb_data:/data/lancedb

  audit-logger:
    build: ./interceptors/audit_logger
    restart: always
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgresql://dial:${POSTGRES_PASSWORD:-dial_password}@postgres:5432/evidence
    depends_on:
      - postgres

  # ==========================================================================
  # Infrastructure (Proxy & Analytics)
  # ==========================================================================

  influxdb:
    image: influxdb:2.7
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=dial
      - DOCKER_INFLUXDB_INIT_BUCKET=analytics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  analytics-realtime:
    image: docker.io/epam/ai-dial-analytics-realtime:0.6.2
    restart: always
    ports:
      - "8087:8080"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-auth-token
      - INFLUXDB_ORG=dial
      - INFLUXDB_BUCKET=analytics
    depends_on:
      - influxdb

  # ==========================================================================
  # Portainer CE — Docker Container Management UI
  # ==========================================================================

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - core

volumes:
  pgdata:
  ollama_models:
  lancedb_data:
  caddy_data:
  caddy_config:
  influxdb_data:
  directus_uploads:
  sbv_data:
  portainer_data:
